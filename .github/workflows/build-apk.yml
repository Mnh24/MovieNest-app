name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/flutter-movie-app-lhrips

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
