name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build web release
        # --no-tree-shake-icons: the icon tree-shaker drops glyphs that are
        # only referenced through runtime conditionals (e.g. the theme toggle's
        # light/dark icon), leaving them blank on web. Keeping the full icon
        # font guarantees every icon renders.
        run: flutter build web --release --no-tree-shake-icons --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOVIENEST_68F5F }}"
          channelId: live
          projectId: movienest-68f5f
