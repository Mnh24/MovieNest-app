<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MovieNest - browse trending movies, search, and manage an offline watchlist.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MovieNest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MovieNest</title>
  <link rel="manifest" href="manifest.json">

  <!-- Theme colour of the browser UI / PWA chrome. -->
  <meta name="theme-color" content="#0C0C10">

  <style>
    /* Paint the page's own background the app's dark "glass canvas" colour so
       nothing ever flashes white — most visibly during the browser's native
       edge back-swipe, where the area revealed beside the sliding page is the
       page background rather than Flutter's canvas. Also stops the horizontal
       overscroll from triggering browser history navigation where supported,
       leaving the in-app Cupertino swipe-back gesture in control. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0C0C10;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
